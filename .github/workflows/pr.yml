name: PR

# Per CLAUDE rule 8 + [[vault/10_Architecture/CI Strategy]]:
#   - Public repo → Actions minutes are unlimited, but minimal wall-clock
#     time + minimal self-hosted-runner wear still matter.
#   - Skip docs-only changes entirely.
#   - One in-flight run per branch — newer pushes cancel older runs.
#   - No submodules: the references/ submodules (maui, maui-toolkit,
#     maui-community-toolkit, dotnet-community-toolkit) are research-only,
#     not build dependencies. Pulling them historically failed on Windows
#     with "Filename too long" inside references/maui-community-toolkit
#     and cost ~30 s of bandwidth on every job for no value.
#   - Cross-compile jobs (linux-cross / windows-cross) are deferred until
#     cmake/toolchains/*.cmake actually exists — every previous run
#     had `continue-on-error: true` on every cmake/build step, so they
#     never validated anything and just burnt runner minutes.
#   - Android emulator stays on the self-hosted runner, non-blocking.

on:
  pull_request:
    # Docs-only changes skip the C++ matrix entirely.
    paths-ignore:
      - 'vault/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - 'tools/dev/**'   # generator scripts; tested out-of-band
  push:
    branches: [main]
    paths-ignore:
      - 'vault/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - 'tools/dev/**'

# Cancel previous runs on the same ref when a newer commit arrives.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  linux-native:
    name: linux-native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (no submodules)
        # The references/maui-* submodules are MAUI source-of-truth
        # research material, NOT build dependencies — keep them out of
        # CI to avoid the multi-GB clone + Windows-side long-path break.
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install C++ + GTK4 + Cairo dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld ninja-build cmake pkg-config \
            libgtk-4-dev libcairo2-dev libwebkit2gtk-4.1-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-native-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/**') }}
          # ccache is cheap — 200 MB cap is plenty for the C++23 codebase.
          max-size: 200M

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        # Examples are enabled so the gtk4_* demos compile-check on the
        # canonical platform; tools are enabled so mpapp / mpapp-xc tests
        # run inside ctest.
        run: |
          cmake -S . -B build -G Ninja \
            -DMPAPP_SUPERBUILD=OFF \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  # windows-native — reinstated after T-0032 Path B (commit decoupling
  # `mpapp-core` from the `mpapp.hpp` umbrella). `mpapp-core` + the
  # entire mock/test suite now build platform-neutral, with zero
  # WinUI 3 / WindowsAppSDK dependency, so the GitHub-hosted
  # `windows-latest` runner (VS2022 + C++/WinRT, but NO WindowsAppSDK)
  # builds + tests them green.
  #
  # Examples are OFF: the WinUI 3 example apps DO need WindowsAppSDK
  # (provisioned via cmake/WindowsAppSDK.cmake on a local/self-hosted
  # Windows machine), so they stay out of the cloud per-PR gate. The
  # full example + real-handler build runs on the self-hosted
  # `mpapp-windows-self` runner and on tagged releases (release.yml).
  windows-native:
    name: windows-native
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up MSVC dev environment (cl + ninja on PATH)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-native-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/**') }}
          max-size: 200M

      - name: Configure (examples OFF — core is platform-neutral; WinUI examples need WindowsAppSDK)
        run: >
          cmake -S . -B build -G Ninja
          -DMPAPP_SUPERBUILD=OFF
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          -DMPAPP_BUILD_EXAMPLES=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  # Quality gates (ADR-0003 matrix): AddressSanitizer + UndefinedBehaviorSanitizer
  # over the portable core + tests, plus a clang-tidy pass. These run natively on
  # Linux (the sanitizer runtimes + clang-tidy need a native sysroot — they don't
  # mix with the Zig cross toolchains). Examples are OFF (the presets disable
  # them); core + tests are the instrumented surface.
  linux-quality:
    name: linux-quality (asan/ubsan/tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install toolchains + Cairo
        # GCC drives the sanitizers (libasan/libubsan ship with g++ — no
        # compiler-rt package matching); Clang + clang-tidy drive the tidy pass.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ clang clang-tidy ninja-build cmake pkg-config libcairo2-dev

      - name: UndefinedBehaviorSanitizer (GCC)
        run: |
          cmake --preset ubsan
          cmake --build build/ubsan --parallel
          ctest --preset ubsan --parallel

      - name: AddressSanitizer + LeakSanitizer (GCC)
        run: |
          cmake --preset asan
          cmake --build build/asan --parallel
          ctest --preset asan --parallel

      - name: clang-tidy (report-only)
        # Findings are informational until the backlog is burned down; flip the
        # gate on with -DMPAPP_TIDY_WERROR=ON once clean.
        run: |
          cmake --preset tidy
          cmake --build build/tidy --parallel

  # Self-hosted Android emulator run. Non-blocking + only for in-repo PRs
  # (fork PRs would expose the self-hosted machine — security boundary
  # per vault/50_Tasks/.../runner-setup.md).
  android-emulator:
    name: android-emulator (self-hosted)
    runs-on: [self-hosted, mpapp-windows-self]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Build android-arm64 (deferred — toolchain pending T-0009)
        shell: pwsh
        run: |
          if (Test-Path cmake/toolchains/android-arm64.cmake) {
            cmake -S . -B build-android `
              -DMPAPP_SUPERBUILD=OFF `
              -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/android-arm64.cmake `
              -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
            cmake --build build-android --parallel
          } else {
            Write-Host "::notice::Android cross toolchain file missing (T-0009 deferred); skipping build."
          }

      - name: Run Android emulator smoke tests
        shell: pwsh
        run: Write-Host "::notice::Android emulator harness pending T-0008 / T-0009"
