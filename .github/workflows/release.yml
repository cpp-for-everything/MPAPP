name: Release

# Per CLAUDE rule 8 + [[vault/10_Architecture/CI Strategy]]:
#   - Tagged releases run the full validation set, including the macOS
#     cloud runner (no self-hosted Mac available yet — see M-07).
#   - The cross-compile jobs (linux→windows, windows→linux/android) stay
#     out until cmake/toolchains/*.cmake actually exists. Reinstate them
#     once T-0009 lands the toolchain files; until then they only burn
#     minutes via `continue-on-error: true` no-ops.
#   - Same submodule discipline as pr.yml: don't clone the multi-GB
#     references/maui-* research mirrors that break Windows long-path
#     checkouts and are not on any build path.

on:
  push:
    tags: ['v*']

# A tag-driven release should never have two concurrent runs of the same
# tag — but a force-tag move would. Cancel the older one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  linux-native:
    name: linux-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install C++ + GTK4 + Cairo dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld ninja-build cmake pkg-config \
            libgtk-4-dev libcairo2-dev libwebkit2gtk-4.1-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-linux-native-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/**') }}
          max-size: 200M

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  windows-native:
    name: windows-native
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: release-windows-native-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/**') }}
          max-size: 300M

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} `
            -DMPAPP_BUILD_EXAMPLES=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --parallel

  macos-native:
    name: macos-native
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-macos-native-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'cmake/**') }}
          max-size: 200M

      - name: Configure macos-arm64
        # Xcode Clang; native macOS doesn't need Zig. Examples disabled
        # until macOS handler set is complete (M-07).
        run: |
          cmake -S . -B build-macos-arm64 -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DMPAPP_BUILD_EXAMPLES=OFF

      - name: Build macos-arm64
        run: cmake --build build-macos-arm64 --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      - name: Test macos-arm64
        run: ctest --test-dir build-macos-arm64 -C ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure --parallel

      - name: Configure ios-arm64 (Simulator)
        run: |
          cmake -S . -B build-ios-arm64 -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DMPAPP_BUILD_EXAMPLES=OFF \
            -DMPAPP_BUILD_TOOLS=OFF

      - name: Build ios-arm64 (Simulator)
        run: cmake --build build-ios-arm64 --config ${{ env.CMAKE_BUILD_TYPE }} --parallel
